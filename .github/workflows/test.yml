name: Test Project
on:
  push:
    branches:
      - 'nestjs_v11'
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT: 8080
      DB_CONNECTION_URL: mongodb://127.0.0.1:27017
      DATABASE_NAME: NestJS
      JWT_SECRET_TOKEN: $ {{ secrets.JWT_SECRET_TOKEN }}
      JWT_REFRESH_SECRET_TOKEN: $ {{ secrets.JWT_REFRESH_SECRET_TOKEN }}
      HASH_SALT_ROUNDS: 10
      JWT_TOKEN_EXPIRATION: '3600s'
      JWT_REFRESH_SECRET_TOKEN_EXPIRATION: '7d'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install NodeJs
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
